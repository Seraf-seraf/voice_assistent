app:
  mode: always
  system_prompt: >-
    Ты локальный голосовой ассистент. Отвечай на русском языке.
  response_policy: >-
    Отвечай кратко и естественно. Не озвучивай листинги кода и длинные ссылки.

log:
  level: info
  format: text

audio:
  input_device: ""
  output_device: "" # В Linux TTS это имя ALSA PCM, не ID устройства захвата.
  sample_rate: 16000
  channels: 1
  frame_ms: 20
  buffer_frames: 64

tts:
  model_dir: ""
  threads: 2
  timeout: 5m

vad:
  aggressiveness: 2
  pre_roll: 300ms
  min_speech: 250ms
  end_silence: 600ms
  max_utterance: 30s

stt:
  url: http://127.0.0.1:8081/inference
  timeout: 45s
  max_response_bytes: 1048576

llm:
  # Обязательны для запуска native-модели; абсолютные пути задаются пользователем.
  model: ""
  library_dir: ""
  context_size: 4096
  gpu_layers: 99
  threads: 4
  timeout: 30s
  temperature: 0.4
  max_tokens: 512

dialogue:
  max_history_messages: 20

transcript:
  min_significant_runes: 2
  ignored_exact: ["а", "э", "ээ", "эм"]
  ignored_patterns:
    - '^субтитры (сделал|создал).*$'

wake:
  phrases: ["ассистент"]
  activation_window: 10s

control:
  ptt_key: F8
