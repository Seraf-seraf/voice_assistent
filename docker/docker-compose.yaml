services:
  whisper-stt:
    build:
      context: .
      dockerfile: whisper/Dockerfile
      args:
        WHISPER_CPP_REF: v1.9.0
    container_name: whisper-stt
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - ./models/whisper:/models:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
